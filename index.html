<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<script src="static/config.js"></script>
<script src="static/static-api.js"></script>
<script src="static/ratings.js"></script>

<script>
// Every visit (new tab or window, or after the browser was closed) starts with the name entry; a reload keeps it.
try { if (!sessionStorage.getItem('arena_entered')) location.replace('login.html'); } catch (e) { /* storage blocked: the session cookie still protects the API */ }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome · Moderation Arena</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏟️</text></svg>">
<link rel="stylesheet" href="static/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  .landing { width: 100%; max-width: 760px; margin: 8px auto 40px; }
  .landing-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px 34px 30px; }
  .md { font-size: 0.96rem; line-height: 1.7; color: var(--text-body); }
  .md h1 { font-size: 1.75rem; font-weight: 700; color: var(--text-primary); margin: 0 0 14px; letter-spacing: -0.01em; }
  .md h2 { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); margin: 26px 0 8px; }
  .md p { margin: 0 0 12px; }
  .md ul, .md ol { margin: 0 0 12px; padding-left: 1.4em; }
  .md li { margin: 0.3em 0; }
  .md strong { color: var(--text-primary); }
  .md code { font-family: monospace; font-size: 0.9em; background: var(--border); padding: 0 4px; border-radius: 3px; }
  .md a { color: #0085ff; }
  .landing-start { text-align: center; margin-top: 26px; }
  .start-btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 34px; border-radius: 12px; border: none;
    background: #0085ff; color: #fff; font-size: 1.05rem; font-weight: 600;
    text-decoration: none; cursor: pointer; transition: background 0.15s;
  }
  .start-btn:hover { background: #0073e0; }
  .landing-name { margin-top: 12px; font-size: 0.82rem; color: var(--text-muted); }
</style>
</head>
<body>

<!-- Left sidebar -->
<div class="sidebar" id="sidebar">
  <button class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle sidebar">
    <span class="sidebar-toggle-icon">‹</span>
  </button>

  <div class="sidebar-top">
    <a class="sidebar-btn active" href="index.html" title="Home">
      <span class="sidebar-icon"><i class="fa-solid fa-house"></i></span>
      <span class="sidebar-label">Home</span>
    </a>
    <a class="sidebar-btn" href="arena.html" title="New Post">
      <span class="sidebar-icon"><i class="fa-solid fa-comment-medical"></i></span>
      <span class="sidebar-label">New Post</span>
    </a>
    <a class="sidebar-btn" href="leaderboard.html" title="Leaderboard">
      <span class="sidebar-icon"><i class="fa-solid fa-ranking-star"></i></span>
      <span class="sidebar-label">Leaderboard</span>
    </a>
    <a class="sidebar-btn" id="annotate-btn" href="annotate.html" title="Annotate" style="display:none">
      <span class="sidebar-icon"><i class="fa-solid fa-list-check"></i></span>
      <span class="sidebar-label">Annotate</span>
    </a>
  </div>

  <div class="sidebar-bottom">
    <div class="sidebar-user">
      <span id="user-info" class="user-info"></span>
    </div>
    <button class="sidebar-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle theme">
      <span class="sidebar-icon"><i class="fa-solid fa-moon"></i></span>
      <span class="sidebar-label">Dark</span>
    </button>
    <button class="sidebar-btn" id="logout-btn" onclick="logout()" title="Change name">
      <span class="sidebar-icon"><i class="fa-solid fa-right-from-bracket"></i></span>
      <span class="sidebar-label">Change name</span>
    </button>
  </div>
</div>
<script>
(function() {
  const _hasSess = document.cookie.split(';').some(c => c.trim().startsWith('arena_has_session='));
  const _pref    = localStorage.getItem('sidebar_collapsed');
  if (_hasSess ? _pref !== '0' : _pref === '1') {
    document.getElementById('sidebar').classList.add('collapsed');
    document.querySelector('.sidebar-toggle-icon').textContent = '›';
  }
})();
function toggleSidebar() {
  const s = document.getElementById('sidebar');
  const collapsed = s.classList.toggle('collapsed');
  document.querySelector('.sidebar-toggle-icon').textContent = collapsed ? '›' : '‹';
  localStorage.setItem('sidebar_collapsed', collapsed ? '1' : '0');
}
</script>

<!-- Main content -->
<div class="main-content">

<div class="topbar">
  <h1 class="topbar-wordmark">🏟️ Moderation Arena</h1>
</div>

<div class="landing">
  <div class="landing-card">
    <div id="landing-md" class="md"><div class="spinner"></div></div>
    <div class="landing-start">
      <a class="start-btn" href="arena.html"><i class="fa-solid fa-shuffle"></i> Show me a random post</a>
      <div id="annotate-start" style="display:none;margin-top:14px">
        <a class="start-btn" href="annotate.html" style="background:transparent;color:#0085ff;border:1.5px solid #0085ff;padding:11px 26px;font-size:0.98rem">
          <i class="fa-solid fa-list-check"></i> <span id="annotate-start-text">Annotation</span></a>
      </div>
      <div class="landing-name" id="landing-name"></div>
    </div>
  </div>
</div>

</div><!-- /main-content -->

<script>
// ── Theme ─────────────────────────────────────────────────
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  const btn = document.getElementById('theme-btn');
  btn.querySelector('.sidebar-icon').innerHTML = t === 'light' ? '<i class="fa-solid fa-moon"></i>' : '<i class="fa-solid fa-sun"></i>';
  btn.querySelector('.sidebar-label').textContent = t === 'light' ? 'Dark' : 'Light';
  localStorage.setItem('theme', t);
}
function toggleTheme() {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}
applyTheme(localStorage.getItem('theme') || 'light');

async function logout() {
  try { sessionStorage.removeItem('arena_entered'); } catch (e) { /* ignore */ }
  try { await fetch('/api/logout', { method: 'POST' }); } catch (e) { /* ignore */ }
  window.location.href = 'login.html';
}

function esc(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

async function loadMe() {
  try {
    const r = await fetch('/api/me');
    const d = await r.json();
    if (!r.ok || !d.logged_in) { window.location.href = 'login.html'; return; }
    document.getElementById('user-info').innerHTML = `<strong>${esc(d.username)}</strong> · ${d.vote_count} vote${d.vote_count === 1 ? '' : 's'}`;
    document.getElementById('landing-name').textContent =
      d.vote_count ? `Signed in as ${d.username} — ${d.vote_count} vote${d.vote_count === 1 ? '' : 's'} so far.` : `Signed in as ${d.username}.`;
    if (d.is_annotator) {
      document.getElementById('annotate-btn').style.display = '';
      document.getElementById('annotate-start').style.display = '';
      try {
        const s = await (await fetch('/api/annotate/state')).json();
        document.getElementById('annotate-start-text').textContent =
          s.done_count >= s.total ? `Annotation — all ${s.total} done` : `Continue annotating (${s.done_count} of ${s.total} done)`;
      } catch (e) { /* ignore */ }
    }
  } catch (e) { /* ignore */ }
}

async function loadLanding() {
  const el = document.getElementById('landing-md');
  try {
    const r = await fetch('/api/landing');
    if (r.status === 401) { window.location.href = 'login.html'; return; }
    const d = await r.json();
    el.innerHTML = window.marked ? marked.parse(d.text) : '<pre style="white-space:pre-wrap">' + esc(d.text) + '</pre>';
  } catch (e) {
    el.textContent = 'Welcome to the Moderation Arena.';
  }
}

loadMe();
loadLanding();
</script>
</body>
</html>
